name: JoyVerse Browser Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Published Studio URL (leave blank to use GitHub Pages)"
        required: false
        type: string
  workflow_run:
    workflows: ["Deploy JoyVerse Video Studio"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: joyverse-browser-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ inputs.base_url || 'https://ramihossin.github.io/joyverse-video-studio/' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npx playwright test
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: joyverse-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
