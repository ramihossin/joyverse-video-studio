name: NiftyVid anonymous Wan smoke test

on:
  push:
    branches: [experiment/niftyvid-wan-smoke]
    paths:
      - ".github/workflows/niftyvid-smoke.yml"

permissions:
  actions: read
  contents: write

jobs:
  generate-one-diagnostic-clip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/niftyvid-wan-smoke

      - name: Reuse a successful earlier run if one exists
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: experiment/niftyvid-wan-smoke
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, zipfile, io
          repo, branch = os.environ["REPO"], os.environ["BRANCH"]
          token, current = os.environ["GH_TOKEN"], int(os.environ["CURRENT_RUN_ID"])
          output = os.environ["GITHUB_OUTPUT"]
          headers = {"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Authorization":"Bearer "+token}
          base = "https://api.github.com/repos/" + repo
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as res: return json.load(res)
          data = get(base + "/actions/workflows/niftyvid-smoke.yml/runs?branch=" + branch + "&per_page=20")
          runs = sorted([r for r in data.get("workflow_runs",[]) if r.get("event")=="push" and r.get("head_branch")==branch and int(r.get("id",0))!=current], key=lambda r:r.get("run_number",0), reverse=True)
          previous = runs[0] if runs else None
          for _ in range(24):
              if not previous or previous.get("status") == "completed": break
              time.sleep(20)
              previous = get(base + "/actions/runs/" + str(previous["id"]))
          if previous and previous.get("status") != "completed":
              open("reuse.txt","w").write("Previous smoke run is still in progress; skipped a duplicate generation.")
              with open(output,"a") as f: f.write("found=true\n")
              raise SystemExit(0)
          if previous and previous.get("conclusion") == "success":
              arts = get(base + "/actions/runs/" + str(previous["id"]) + "/artifacts").get("artifacts",[])
              artifact = next((a for a in arts if a.get("name")=="joyverse-wan2-anonymous-smoke" and not a.get("expired")),None)
              if artifact:
                  url = base + "/actions/artifacts/" + str(artifact["id"]) + "/zip"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=60) as res: payload = res.read()
                  with zipfile.ZipFile(io.BytesIO(payload)) as z:
                      for name in z.namelist():
                          if name.endswith("joyverse-wan-smoke.mp4"):
                              open("joyverse-wan-smoke.mp4","wb").write(z.read(name))
                          elif name.endswith("joyverse-smoke-frame.png"):
                              open("joyverse-smoke-frame.png","wb").write(z.read(name))
                  head = open("joyverse-wan-smoke.mp4","rb").read(16) if os.path.exists("joyverse-wan-smoke.mp4") else b""
                  if len(head)>=12 and head[4:8]==b"ftyp":
                      open("reuse.txt","w").write("Reused verified MP4 from previous run "+str(previous["id"])+"; artifact "+str(artifact["id"])+".")
                      with open(output,"a") as f: f.write("found=true\n")
                      raise SystemExit(0)
          open("reuse.txt","w").write("No successful previous MP4 artifact was available; one new anonymous smoke request will be attempted.")
          with open(output,"a") as f: f.write("found=false\n")
          PY

      - name: Create a synthetic test frame
        if: steps.reuse.outputs.found != 'true'
        run: |
          python3 - <<'PY'
          import math, struct, zlib
          w = h = 512
          vertices = []
          for i in range(10):
              angle = -math.pi / 2 + i * math.pi / 5
              radius = 150 if i % 2 == 0 else 65
              vertices.append((256 + math.cos(angle) * radius, 256 + math.sin(angle) * radius))
          def inside_star(x, y):
              inside = False
              j = len(vertices) - 1
              for i, (xi, yi) in enumerate(vertices):
                  xj, yj = vertices[j]
                  if ((yi > y) != (yj > y)) and (x < (xj - xi) * (y - yi) / ((yj - yi) or 1e-9) + xi):
                      inside = not inside
                  j = i
              return inside
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  t = y / (h - 1)
                  r = int(22 + 42*t + 12*math.sin(x/48))
                  g = int(30 + 45*(1-t) + 10*math.cos(x/52))
                  b = int(88 + 100*(1-t) + 16*math.sin((x+y)/60))
                  if inside_star(x,y): r,g,b = 255,205+(x%35),54
                  raw.extend((max(0,min(255,r)),max(0,min(255,g)),max(0,min(255,b))))
          def chunk(kind,data): return struct.pack(">I",len(data))+kind+data+struct.pack(">I",zlib.crc32(kind+data)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">2I5B",w,h,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(bytes(raw),6))+chunk(b"IEND",b"")
          open("joyverse-smoke-frame.png","wb").write(png)
          PY

      - name: Submit one Wan 2.2 generation and download the MP4
        if: steps.reuse.outputs.found != 'true'
        id: generate
        continue-on-error: true
        env:
          SPACE: https://cbensimon-wan2-2-fp8da-aoti-preview2.hf.space
        run: |
          set -euo pipefail
          upload="$(curl --fail --silent --show-error --max-time 90 -F "files=@joyverse-smoke-frame.png;filename=joyverse-smoke-frame.png" "$SPACE/gradio_api/upload")"
          image_path="$(printf '%s' "$upload" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0])')"
          export IMAGE_PATH="$image_path"
          python3 - <<'PY' > request.json
          import json, os
          base=os.environ["SPACE"]; path=os.environ["IMAGE_PATH"]
          image={"path":path,"url":base+"/gradio_api/file="+path,"orig_name":"joyverse-smoke-frame.png","size":None,"mime_type":"image/png","meta":{"_type":"gradio.FileData"}}
          data=[image,None,"A glowing golden star gently rotates and sparkles above a colorful magical garden, slow smooth camera push-in, polished cheerful 3D animated film look, soft light, no text, no people.",6,"blurry, distorted, extra limbs, text, watermark",3.5,1,1,42,True,6,"UniPCMultistep",3.0,16,False,True]
          print(json.dumps({"data":data}))
          PY
          accepted="$(curl --fail --silent --show-error --max-time 90 -H "Content-Type: application/json" --data-binary @request.json "$SPACE/gradio_api/call/generate_video")"
          event_id="$(printf '%s' "$accepted" | python3 -c 'import json,sys; print(json.load(sys.stdin)["event_id"])')"
          curl --fail --silent --show-error --max-time 600 -H "Accept: text/event-stream" "$SPACE/gradio_api/call/generate_video/$event_id" > result.sse
          python3 - <<'PY' > video-url.txt
          import json, os
          raw=open("result.sse",encoding="utf-8").read()
          for block in raw.replace("\r\n","\n").split("\n\n"):
              event="message"; data=[]
              for line in block.split("\n"):
                  if line.startswith("event:"): event=line[6:].strip()
                  elif line.startswith("data:"): data.append(line[5:].strip())
              if event=="error": raise SystemExit("Upstream generation error: "+"\n".join(data)[:1000])
              if event=="complete" and data:
                  result=json.loads("\n".join(data)); first=result[0] if isinstance(result,list) and result else None
                  if isinstance(first,dict) and first.get("url"): print(first["url"])
                  elif isinstance(first,dict) and first.get("path"): print(os.environ["SPACE"]+"/gradio_api/file="+first["path"])
                  elif isinstance(first,str): print(os.environ["SPACE"]+"/gradio_api/file="+first)
                  else: raise SystemExit("Completed event did not contain a video file.")
                  break
          else: raise SystemExit("SSE stream ended without a complete event.")
          PY
          curl --fail --location --silent --show-error --max-time 120 "$(cat video-url.txt)" -o joyverse-wan-smoke.mp4
          python3 - <<'PY'
          import os
          data=open("joyverse-wan-smoke.mp4","rb").read(16)
          if len(data)<12 or data[4:8]!=b"ftyp": raise SystemExit("Provider output is not a valid MP4 container.")
          print("Verified MP4 header; bytes:",os.path.getsize("joyverse-wan-smoke.mp4"))
          PY

      - name: Write durable result record
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          REUSED: ${{ steps.reuse.outputs.found }}
        run: |
          if [ "$REUSED" = "true" ] && [ -s joyverse-wan-smoke.mp4 ]; then
            RESULT="PASS: reused a previously verified MP4 artifact."
          elif [ -s joyverse-wan-smoke.mp4 ]; then
            RESULT="PASS: generated and verified a new MP4."
          else
            RESULT="FAIL: no verified MP4. Generation step outcome: ${GENERATE_OUTCOME:-not-run}. Inspect this workflow run's logs."
          fi
          {
            echo "# NiftyVid anonymous Wan smoke test"
            echo
            echo "- Updated: $(date -u +%FT%TZ)"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Result: $RESULT"
            echo "- Provider: public Wan 2.2 ZeroGPU Space"
            echo "- Duration request: 3.5 seconds; expected cap: 4.5 seconds"
            echo "- No API key or paid provider credits were used."
          } > NIFTYVID_SMOKE_RESULT.md
          if [ -s joyverse-wan-smoke.mp4 ]; then
            echo "- MP4 bytes: $(wc -c < joyverse-wan-smoke.mp4)" >> NIFTYVID_SMOKE_RESULT.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NIFTYVID_SMOKE_RESULT.md
          git commit -m "Record NiftyVid smoke test result" || true
          git push origin HEAD:experiment/niftyvid-wan-smoke || true

      - name: Upload verified artifact
        if: always() && hashFiles('joyverse-wan-smoke.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: joyverse-wan2-anonymous-smoke
          path: |
            joyverse-wan-smoke.mp4
            joyverse-smoke-frame.png
            NIFTYVID_SMOKE_RESULT.md
          if-no-files-found: error
          retention-days: 7
