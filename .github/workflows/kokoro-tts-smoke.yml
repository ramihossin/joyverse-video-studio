name: Kokoro CPU TTS API discovery and generation

on:
  push:
    branches: [experiment/niftyvid-wan-smoke]
    paths:
      - ".github/workflows/kokoro-tts-smoke.yml"

permissions:
  contents: write

jobs:
  generate-one-voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/niftyvid-wan-smoke
      - name: Install Gradio client
        run: python -m pip install --disable-pip-version-check gradio_client
      - name: Discover API and generate voiceover
        id: generate
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from gradio_client import Client
          space = "https://robinsaiworld-kokoro-tts-cpu.hf.space"
          req = urllib.request.Request(space + "/gradio_api/info", headers={"Accept":"application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  info = json.loads(response.read())
              open("kokoro-api-info.json","w").write(json.dumps(info,indent=2))
              print("API INFO:", json.dumps(info,indent=2)[:12000])
          except Exception as exc:
              print("API info endpoint unavailable:", repr(exc))
          client = Client("RobinsAIWorld/Kokoro-TTS-cpu", verbose=True)
          client.view_api()
          result = client.predict(
              "Look! A little golden star is shining in the garden. Let us follow its light!",
              "af_heart", 1.0, False,
              api_name="/generate_first"
          )
          print("PREDICT RESULT TYPE:", type(result).__name__)
          print("PREDICT RESULT:", repr(result)[:4000])
          audio = result[0] if isinstance(result,(tuple,list)) else result
          if isinstance(audio,dict):
              path = audio.get("path")
              url = audio.get("url")
              if path and os.path.isfile(path):
                  source=path
              elif url:
                  urllib.request.urlretrieve(url,"joyverse-kokoro-voiceover.wav")
                  source="joyverse-kokoro-voiceover.wav"
              else:
                  raise RuntimeError("Audio result dictionary has neither local path nor URL.")
          elif isinstance(audio,str) and os.path.isfile(audio):
              source=audio
          else:
              raise RuntimeError("Unsupported audio result: "+repr(audio)[:1000])
          if source != "joyverse-kokoro-voiceover.wav":
              import shutil; shutil.copyfile(source,"joyverse-kokoro-voiceover.wav")
          data=open("joyverse-kokoro-voiceover.wav","rb").read(44)
          if data[:4] != b"RIFF" or data[8:12] != b"WAVE":
              raise RuntimeError("Generated audio is not WAV.")
          print("VERIFIED_WAV_BYTES:",os.path.getsize("joyverse-kokoro-voiceover.wav"))
          PY
      - name: Record test outcome
        if: always()
        env:
          OUTCOME: ${{ steps.generate.outcome }}
        run: |
          if [ -s joyverse-kokoro-voiceover.wav ]; then
            RESULT="PASS: Gradio client generated and verified a WAV voiceover."
            BYTES="$(wc -c < joyverse-kokoro-voiceover.wav)"
          else
            RESULT="FAIL: no verified WAV. Step outcome: ${OUTCOME:-unknown}."
            BYTES="0"
          fi
          {
            echo "# Kokoro CPU TTS smoke test"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Result: $RESULT"
            echo "- WAV bytes: $BYTES"
            echo "- Space: RobinsAIWorld/Kokoro-TTS-cpu"
            echo "- No API key or paid credits used."
          } > KOKORO_TTS_SMOKE_RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KOKORO_TTS_SMOKE_RESULT.md
          git commit -m "Record Kokoro CPU TTS smoke result" || true
          git push origin HEAD:experiment/niftyvid-wan-smoke || true
      - name: Upload generated voiceover
        if: always() && hashFiles('joyverse-kokoro-voiceover.wav') != ''
        uses: actions/upload-artifact@v4
        with:
          name: joyverse-kokoro-tts-smoke
          path: joyverse-kokoro-voiceover.wav
          retention-days: 7
