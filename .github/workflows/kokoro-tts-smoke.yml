name: Kokoro CPU TTS API discovery and generation

on:
  push:
    branches: [experiment/niftyvid-wan-smoke]
    paths:
      - ".github/workflows/kokoro-tts-smoke.yml"
      - "TTS_SMOKE_TRIGGER.md"

permissions:
  contents: write

jobs:
  generate-one-voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/niftyvid-wan-smoke
      - name: Submit and retrieve TTS through direct Gradio REST
        id: generate
        continue-on-error: true
        env:
          SPACE: https://robinsaiworld-kokoro-tts-cpu.hf.space
        run: |
          set -euo pipefail
          accepted="$(curl --fail --silent --show-error --max-time 120 \
            -H "Content-Type: application/json" \
            --data-binary '{"data":["Look! A little golden star is shining in the garden. Let us follow its light!","af_heart",1.0,false]}' \
            "$SPACE/gradio_api/call/generate_first")"
          event_id="$(printf '%s' "$accepted" | python3 -c 'import json,sys; print(json.load(sys.stdin)["event_id"])')"
          echo "Kokoro event id: $event_id"
          curl --fail --silent --show-error --max-time 600 \
            -H "Accept: text/event-stream" \
            "$SPACE/gradio_api/call/generate_first/$event_id" > result.sse
          echo "SSE response preview:"
          head -c 5000 result.sse || true
          echo
          python3 - <<'PY'
          import json, os
          base=os.environ["SPACE"].rstrip("/")
          raw=open("result.sse",encoding="utf-8",errors="replace").read()
          lines=raw.splitlines()
          event_index=next((i for i,line in enumerate(lines) if line.strip()=="event: complete"),-1)
          if event_index < 0:
              raise SystemExit("No complete event. Raw SSE: "+raw[:2000])
          data_line=next((line for line in lines[event_index+1:] if line.startswith("data:")),None)
          if not data_line:
              raise SystemExit("Complete event has no data line. Raw SSE: "+raw[:2000])
          payload=json.loads(data_line[5:].strip())
          candidates=payload if isinstance(payload,list) else [payload]
          file=next((item for item in candidates if isinstance(item,dict) and (item.get("url") or item.get("path"))),None)
          if not file:
              raise SystemExit("Complete event contains no audio file object: "+repr(payload)[:1500])
          path=file.get("path") or ""
          primary=file.get("url") or ""
          fallback1=base+"/gradio_api/file="+path
          fallback2=base+"/file="+path
          open("audio-url.txt","w").write(primary)
          open("audio-url-fallback.txt","w").write(fallback1)
          open("audio-url-fallback2.txt","w").write(fallback2)
          print("Primary audio URL:",primary)
          print("Fallback 1:",fallback1)
          print("Fallback 2:",fallback2)
          PY
          if ! curl --fail --location --silent --show-error --max-time 120 "$(cat audio-url.txt)" -o joyverse-kokoro-voiceover.wav; then
            echo "Primary audio URL failed; trying Gradio API file endpoint."
            if ! curl --fail --location --silent --show-error --max-time 120 "$(cat audio-url-fallback.txt)" -o joyverse-kokoro-voiceover.wav; then
              echo "Gradio API file endpoint failed; trying legacy file endpoint."
              curl --fail --location --silent --show-error --max-time 120 "$(cat audio-url-fallback2.txt)" -o joyverse-kokoro-voiceover.wav
            fi
          fi
          python3 - <<'PY'
          import os
          data=open("joyverse-kokoro-voiceover.wav","rb").read(44)
          if data[:4] != b"RIFF" or data[8:12] != b"WAVE":
              raise SystemExit("Kokoro output is not a WAV file.")
          print("Verified WAV; bytes:",os.path.getsize("joyverse-kokoro-voiceover.wav"),"sample rate:",int.from_bytes(data[24:28],"little"))
          PY
      - name: Record test outcome
        if: always()
        env:
          OUTCOME: ${{ steps.generate.outcome }}
        run: |
          if [ -s joyverse-kokoro-voiceover.wav ]; then
            RESULT="PASS: direct Gradio REST generated and verified a WAV voiceover."
            BYTES="$(wc -c < joyverse-kokoro-voiceover.wav)"
          else
            RESULT="FAIL: no verified WAV. Step outcome: ${OUTCOME:-unknown}."
            BYTES="0"
          fi
          {
            echo "# Kokoro CPU TTS smoke test"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Result: $RESULT"
            echo "- WAV bytes: $BYTES"
            echo "- Space: RobinsAIWorld/Kokoro-TTS-cpu"
            echo "- No API key or paid credits used."
          } > KOKORO_TTS_SMOKE_RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KOKORO_TTS_SMOKE_RESULT.md
          git commit -m "Record Kokoro CPU TTS smoke result" || true
          git push origin HEAD:experiment/niftyvid-wan-smoke || true
      - name: Upload generated voiceover
        if: always() && hashFiles('result.sse') != ''
        uses: actions/upload-artifact@v4
        with:
          name: joyverse-kokoro-tts-smoke
          path: |
            joyverse-kokoro-voiceover.wav
            result.sse
            audio-url.txt
            audio-url-fallback.txt
            audio-url-fallback2.txt
          if-no-files-found: warn
          retention-days: 7
