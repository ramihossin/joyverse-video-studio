name: Kokoro CPU TTS smoke test

on:
  push:
    branches: [experiment/niftyvid-wan-smoke]
    paths:
      - ".github/workflows/kokoro-tts-smoke.yml"

permissions:
  contents: write

jobs:
  generate-one-voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/niftyvid-wan-smoke

      - name: Generate short English voiceover through public CPU Space
        id: generate
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gradio_client soundfile numpy
          python3 - <<'PY'
          import os, shutil, soundfile as sf, numpy as np
          from gradio_client import Client
          client = Client("RobinsAIWorld/Kokoro-TTS-cpu", verbose=True)
          client.view_api()
          result = client.predict(
              "Look! A little golden star is shining in the garden. Let us follow its light!",
              "af_heart",
              1.0,
              False,
              api_name="/generate_first"
          )
          print("Kokoro result type:", type(result).__name__)
          print("Kokoro result preview:", repr(result)[:1500])
          audio = result[0] if isinstance(result, (tuple, list)) and result else result
          if isinstance(audio, str) and os.path.isfile(audio):
              shutil.copyfile(audio, "joyverse-kokoro-voiceover.wav")
          elif isinstance(audio, dict) and audio.get("path") and os.path.isfile(audio["path"]):
              shutil.copyfile(audio["path"], "joyverse-kokoro-voiceover.wav")
          elif isinstance(audio, tuple) and len(audio) == 2:
              sample_rate, samples = audio
              array = np.asarray(samples)
              if array.dtype.kind == "f":
                  array = np.clip(array, -1.0, 1.0)
                  array = (array * 32767).astype(np.int16)
              elif array.dtype != np.int16:
                  array = array.astype(np.int16)
              sf.write("joyverse-kokoro-voiceover.wav", array, int(sample_rate), subtype="PCM_16")
          else:
              raise SystemExit("Kokoro returned an unsupported audio value.")
          info = sf.info("joyverse-kokoro-voiceover.wav")
          if info.frames <= 0 or info.samplerate < 8000:
              raise SystemExit("Kokoro returned an invalid or empty WAV.")
          print("Verified WAV:", info)
          PY
      - name: Record TTS result
        if: always()
        env:
          OUTCOME: ${{ steps.generate.outcome }}
        run: |
          if [ -s joyverse-kokoro-voiceover.wav ]; then
            RESULT="PASS: public Kokoro CPU Space generated a valid WAV voiceover."
            BYTES="$(wc -c < joyverse-kokoro-voiceover.wav)"
          else
            RESULT="FAIL: no verified WAV. Step outcome: ${OUTCOME:-unknown}. Inspect this workflow run's logs."
            BYTES="0"
          fi
          {
            echo "# Kokoro CPU TTS smoke test"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Result: $RESULT"
            echo "- WAV bytes: $BYTES"
            echo "- Voice: af_heart"
            echo "- No API key or paid credits used."
          } > KOKORO_TTS_SMOKE_RESULT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KOKORO_TTS_SMOKE_RESULT.md
          git commit -m "Record Kokoro CPU TTS smoke result" || true
          git push origin HEAD:experiment/niftyvid-wan-smoke || true

      - name: Upload generated voiceover
        if: always() && hashFiles('joyverse-kokoro-voiceover.wav') != ''
        uses: actions/upload-artifact@v4
        with:
          name: joyverse-kokoro-tts-smoke
          path: |
            joyverse-kokoro-voiceover.wav
            KOKORO_TTS_SMOKE_RESULT.md
            KOKORO_TTS_SMOKE_RESULT.md
          if-no-files-found: warn
          retention-days: 7
