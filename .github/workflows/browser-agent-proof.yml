name: Browser Agent Proof
on:
  push:
    branches:
      - loremotion-verified-submit-20261115
permissions:
  contents: read
  actions: read
concurrency:
  group: browser-agent-proof-freevideoai
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated proof branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Ensure a headed-browser display and reliable DNS are available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          sudo mkdir -p /etc/systemd/resolved.conf.d
          printf '[Resolve]\\nDNS=1.1.1.1 8.8.8.8\\nFallbackDNS=1.0.0.1 8.8.4.4\\n' | sudo tee /etc/systemd/resolved.conf.d/99-joyverse-public-dns.conf
          sudo systemctl restart systemd-resolved
          resolvectl flush-caches
          getent hosts challenges.cloudflare.com
      - name: Check official LoreMotion free LTX flow and submit only after site-issued verification
        run: xvfb-run -a node browser-agent/smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent-proof
          path: browser-agent-output/
          if-no-files-found: warn
          retention-days: 2
