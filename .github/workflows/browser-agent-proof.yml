name: Browser Agent Proof
on:
  push:
    branches:
      - loremotion-headed-retry-20261115
permissions:
  contents: read
  actions: read
concurrency:
  group: browser-agent-proof-freevideoai
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated proof branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Ensure a headed-browser display is available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y xvfb; fi
      - name: Run browser navigation and interaction test
        run: xvfb-run -a node browser-agent/smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent-proof
          path: browser-agent-output/
          if-no-files-found: warn
          retention-days: 2
