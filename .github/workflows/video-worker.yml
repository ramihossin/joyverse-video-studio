name: JoyVerse background video worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joyverse-background-video-worker
  cancel-in-progress: false

jobs:
  process-one-video:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate worker configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET || secrets.R2_BUCKET }}
          OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT || secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          : "${DATABASE_URL:?Missing repository Actions secret: DATABASE_URL}"
          if [ -n "$OBJECT_STORAGE_BUCKET$OBJECT_STORAGE_ENDPOINT$R2_ACCOUNT_ID$OBJECT_STORAGE_ACCESS_KEY_ID$OBJECT_STORAGE_SECRET_ACCESS_KEY" ]; then
            : "${OBJECT_STORAGE_BUCKET:?Missing object-storage bucket}"
            : "${OBJECT_STORAGE_ACCESS_KEY_ID:?Missing object-storage access key}"
            : "${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Missing object-storage secret key}"
            if [ -z "$OBJECT_STORAGE_ENDPOINT" ] && [ -z "$R2_ACCOUNT_ID" ]; then
              echo "::error::Set OBJECT_STORAGE_ENDPOINT, R2_ENDPOINT, or R2_ACCOUNT_ID."
              exit 1
            fi
          else
            echo "Using PostgreSQL object storage fallback (50 MiB maximum per object)."
          fi
      - name: Install dependencies
        run: npm ci
      - name: Process one queued video task
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET || secrets.R2_BUCKET }}
          OBJECT_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION || secrets.R2_REGION }}
          OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT || secrets.R2_ENDPOINT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: npm run worker:once
