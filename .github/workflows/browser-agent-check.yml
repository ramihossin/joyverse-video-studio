name: Browser Agent Validation
on:
  push:
    branches: [feature/free-browser-video-agent]
    paths:
      - "browser-agent/**"
      - ".github/workflows/browser-agent-check.yml"
  pull_request:
    paths:
      - "browser-agent/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: browser-agent
        run: npm install
      - name: Run tests
        working-directory: browser-agent
        run: npm test
      - name: Check JavaScript syntax
        working-directory: browser-agent
        run: node --check server.js && node --check store.js && node --check ui/app.js && node --check smoke-test.js
      - name: Build browser container
        run: docker build -t joyverse-browser-agent ./browser-agent
      - name: Launch Chromium with its sandbox enabled
        run: docker run --rm --init --ipc=host --user pwuser --security-opt seccomp=./browser-agent/seccomp_profile.json joyverse-browser-agent node smoke-test.js
