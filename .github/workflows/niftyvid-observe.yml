name: Inspect NiftyVid smoke run (diagnostic)

on:
  pull_request:
    branches: [experiment/niftyvid-wan-smoke]
    paths:
      - ".github/workflows/niftyvid-observe.yml"

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find the push-triggered NiftyVid run and its artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: experiment/niftyvid-wan-smoke
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]
          headers = {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          if token:
              headers["Authorization"] = "Bearer " + token
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          base = "https://api.github.com/repos/" + repo
          runs_url = base + "/actions/workflows/niftyvid-smoke.yml/runs?branch=" + branch + "&per_page=10"
          data = get(runs_url)
          runs = [r for r in data.get("workflow_runs", []) if r.get("event") == "push" and r.get("head_branch") == branch]
          if not runs:
              print("NO_PUSH_RUN: the push-triggered smoke workflow has no recorded run.")
              raise SystemExit(0)
          run = max(runs, key=lambda r: r.get("run_number", 0))
          for _ in range(12):
              if run.get("status") == "completed":
                  break
              time.sleep(10)
              run = get(base + "/actions/runs/" + str(run["id"]))
          print("RUN:", json.dumps({k: run.get(k) for k in ("id", "run_number", "status", "conclusion", "head_sha", "html_url")}))
          artifacts = get(base + "/actions/runs/" + str(run["id"]) + "/artifacts").get("artifacts", [])
          print("ARTIFACTS:", json.dumps([{k: a.get(k) for k in ("id", "name", "expired", "size_in_bytes")} for a in artifacts]))
          if run.get("status") == "completed" and run.get("conclusion") == "success" and any(a.get("name") == "joyverse-wan2-anonymous-smoke" and not a.get("expired") for a in artifacts):
              print("RESULT: generated MP4 artifact is available.")
          else:
              print("RESULT: no verified successful MP4 artifact is available.")
              if run.get("status") == "completed" and run.get("conclusion") != "success":
                  raise SystemExit("Smoke workflow ended with conclusion: " + str(run.get("conclusion")))
          PY
