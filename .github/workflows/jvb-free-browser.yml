name: JVB Free Browser Runner

on:
  push:
    branches:
      - feature/jvb-github-actions-browser
    paths:
      - "jvb-agent/inbox/*.json"

permissions:
  contents: write

concurrency:
  group: jvb-free-browser-runner
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out task queue
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run queued JVB browser tasks
        run: node jvb-agent/runner.mjs

      - name: Commit JVB task results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jvb-agent/results
          if git diff --cached --quiet; then
            echo "No new results to commit."
            exit 0
          fi
          git commit -m "JVB: save browser task results [skip ci]"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload JVB screenshots and downloaded files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvb-browser-output-${{ github.run_id }}
          path: jvb-agent/output/
          if-no-files-found: ignore
          retention-days: 1
