name: Bridge tests

on:
  pull_request:
    branches: [main, feat/durable-server-task-queue, feat/server-video-worker-foundation]
  push:
    branches: [main, feat/server-video-worker-foundation, feat/off-browser-video-worker-core]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Validate Android worker Python syntax
        run: python -m py_compile bridge/hermes_phone_worker.py
