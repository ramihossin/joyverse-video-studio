name: Bridge tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/server-video-worker-foundation]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
